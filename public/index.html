<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยินดีต้อนรับ - My Ice Cream Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> 
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* CSS เฉพาะสำหรับหน้านี้ (Landing Page) */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-body) 0%, #fff0f3 100%);
            flex-direction: column;
            text-align: center;
        }

        .landing-container {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            animation: fadeIn 0.5s ease-out;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 2rem;
        }

        p {
            color: var(--text-sub);
            margin-bottom: 30px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border: 2px solid #eee;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .menu-btn:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            color: var(--primary);
        }

        .menu-btn i {
            font-size: 1.5rem;
            width: 40px;
        }

        .icon-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .role-tag {
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 10px;
            background: #eee;
            color: #666;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <div style="font-size: 4rem; margin-bottom: 10px;">🍦</div>
        <h1>My Ice Cream</h1>
        <p>เลือกระบบที่ต้องการเข้าใช้งาน</p>

        <a href="customer.html" class="menu-btn">
            <div class="icon-box">
                <i class="fas fa-ice-cream" style="color: var(--primary);"></i>
                <span>สั่งอาหาร</span>
            </div>
            <span class="role-tag">ลูกค้า</span>
        </a>

        <a href="staff.html" class="menu-btn">
            <div class="icon-box">
                <i class="fas fa-utensils" style="color: var(--warning);"></i>
                <span>ห้องครัว</span>
            </div>
            <span class="role-tag">พนักงาน</span>
        </a>

        <a href="admin.html" class="menu-btn">
            <div class="icon-box">
                <i class="fas fa-cogs" style="color: #3498db;"></i>
                <span>จัดการร้าน</span>
            </div>
            <span class="role-tag">เจ้าของร้าน</span>
        </a>

    </div>

    <div style="margin-top: 20px; font-size: 0.8rem; color: #999;">
        System v1.0.0
    </div>

</body>
</html>
