<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Kanit";
        background: #2c3e50;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 40px;
        border-radius: 12px;
        width: 300px;
        text-align: center;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>🔒 Login</h2>
      <input type="text" id="user" placeholder="Username" />
      <input type="password" id="pass" placeholder="Password" />
      <button onclick="login()">Login</button>
      <p id="err" style="color: red; display: none">Error</p>
      <p style="font-size: 0.8rem; color: #888">admin/1234 | staff/1111</p>
    </div>
    <script>
      async function login() {
        const u = document.getElementById("user").value,
          p = document.getElementById("pass").value;
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, password: p }),
        });
        const data = await res.json();
        if (data.status === "success") {
          sessionStorage.setItem("userRole", data.role);
          window.location.href =
            data.role === "admin" ? "admin.html" : "staff.html";
        } else {
          document.getElementById("err").style.display = "block";
          document.getElementById("err").innerText = data.message;
        }
      }
    </script>
  </body>
</html>
