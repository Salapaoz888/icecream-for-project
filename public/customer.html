<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ice Cream Kiosk</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="btn-track-order" onclick="openTrackModal()">
      🔔 สถานะ
      <span
        id="activeOrderCount"
        style="
          background: red;
          color: white;
          padding: 2px 6px;
          border-radius: 10px;
          font-size: 0.7rem;
          display: none;
        "
        >0</span
      >
    </div>

    <header>
      <div class="brand-title">🍦 My Ice Cream</div>
    </header>

    <div class="container">
      <h2>เลือกเมนู</h2>
      <div class="product-grid" id="productContainer">Loading...</div>
    </div>

    <div class="modal-overlay" id="selectionModal">
      <div class="modal-content">
        <button class="btn-close" onclick="closeSelectionModal()">
          &times;
        </button>
        <h2 id="modalTitle">Product Name</h2>
        <p>
          เลือก
          <span id="maxScoops" style="color: var(--primary); font-weight: bold"
            >0</span
          >
          รสชาติ
        </p>

        <div class="flavor-grid" id="flavorList"></div>

        <div style="margin-top: 20px">
          <strong>ท็อปปิ้ง</strong>
          <div
            id="toppingList"
            style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px"
          ></div>
        </div>

        <div style="margin-top: 20px">
          <input
            type="text"
            id="itemNote"
            placeholder="ระบุเพิ่มเติม (เช่น ไม่ราดซอส)"
            style="
              width: 100%;
              padding: 10px;
              border: 1px solid #ddd;
              border-radius: 8px;
            "
          />
        </div>

        <button class="btn-primary" id="btnAddToBasket" onclick="saveToCart()">
          เพิ่มลงตะกร้า
        </button>
      </div>
    </div>

    <div class="modal-overlay" id="cartModal">
      <div class="modal-content" style="background: #f4f4f4">
        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
          "
        >
          <h2>ตะกร้า 🛒</h2>
          <button class="btn-close" onclick="closeCartModal()">&times;</button>
        </div>

        <div id="cartItemsList" style="margin-bottom: 20px"></div>

        <div style="background: white; padding: 15px; border-radius: 12px">
          <div
            style="
              display: flex;
              justify-content: space-between;
              font-size: 1.2rem;
              font-weight: bold;
            "
          >
            <span>ยอดรวม</span>
            <span id="cartModalTotal">0.-</span>
          </div>
          <button class="btn-primary" onclick="submitOrderToKitchen()">
            ยืนยันการสั่ง (Confirm)
          </button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="trackModal">
      <div class="modal-content" style="background: #f8f9fa">
        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
          "
        >
          <h2>🔔 สถานะคำสั่งซื้อ</h2>
          <button class="btn-close" onclick="closeTrackModal()">&times;</button>
        </div>
        <div id="trackList"></div>
        <div
          style="
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            margin-top: 20px;
          "
        >
          ประวัติจะถูกลบอัตโนมัติหลัง 24 ชม.
        </div>
      </div>
    </div>

    <div
      class="bottom-cart"
      id="cartBar"
      onclick="openCartModal()"
      style="display: none"
    >
      <div style="display: flex; align-items: center; gap: 10px">
        <div
          style="
            background: white;
            color: var(--text-main);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
          "
          id="cartCount"
        >
          0
        </div>
        <span>ดูตะกร้า</span>
      </div>
      <div style="font-weight: bold" id="cartTotal">0.-</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      // ตัวแปรระบบ
      let categoriesData = [],
        flavorsData = [],
        toppingsData = [];
      let currentStock = {};
      let cart = [];
      let tempSelection = {}; // เก็บข้อมูลชั่วคราวตอนเลือก/แก้ไข

      // --- 1. ระบบจัดการประวัติออเดอร์ (ลบหลัง 24 ชม.) ---
      function loadAndCleanOrders() {
        const raw = localStorage.getItem("myIceCreamOrders");
        if (!raw) return [];

        let orders = JSON.parse(raw);
        const now = Date.now();
        const oneDay = 24 * 60 * 60 * 1000; // 24 ชั่วโมงในหน่วย Milliseconds

        // กรองเอาเฉพาะออเดอร์ที่เวลาผ่านไปไม่ถึง 1 วัน
        const cleanOrders = orders.filter((o) => {
          // ถ้าไม่มี timestamp (ข้อมูลเก่า) ให้เก็บไว้ก่อน หรือจะลบก็ได้ (ในที่นี้ให้เก็บ)
          if (!o.timestampRaw) return true;
          return now - o.timestampRaw < oneDay;
        });

        // บันทึกค่าที่กรองแล้วกลับลงเครื่อง
        localStorage.setItem("myIceCreamOrders", JSON.stringify(cleanOrders));
        return cleanOrders;
      }

      // โหลดประวัติเมื่อเปิดเว็บ
      let myOrders = loadAndCleanOrders();

      // --- Click Outside to Close ---
      window.onclick = function (event) {
        if (event.target.classList.contains("modal-overlay")) {
          if (
            document.getElementById("selectionModal").style.display !== "none"
          )
            closeSelectionModal();
          if (document.getElementById("cartModal").style.display !== "none")
            closeCartModal();
          if (document.getElementById("trackModal").style.display !== "none")
            closeTrackModal();
        }
      };

      async function init() {
        try {
          const res = await fetch("/api/menu");
          const data = await res.json();
          categoriesData = data.categories;
          flavorsData = data.flavors;
          toppingsData = data.toppings;
          renderProductGrid();
        } catch (e) {
          console.error(e);
        }
        updateActiveOrderBadge();
      }
      init();

      socket.on("menu_updated", () => {
        init();
      });

      function renderProductGrid() {
        const c = document.getElementById("productContainer");
        c.innerHTML = "";
        categoriesData.forEach((cat) => {
          const img = cat.img_url || "https://via.placeholder.com/150";
          c.innerHTML += `
                <div class="product-card" onclick="openSelection(${cat.id})">
                    <div class="product-img" style="background-image:url('${img}')"></div>
                    <div class="product-info">
                        <div class="product-name">${cat.name}</div>
                        <div class="product-price">${cat.price}.-</div>
                    </div>
                </div>`;
        });
      }

      // --- 2. ระบบเลือกและแก้ไขสินค้า (Improved Edit) ---
      function openSelection(catId, existingItemId = null) {
        const cat = categoriesData.find((c) => c.id === catId);

        if (existingItemId) {
          // โหมดแก้ไข: คัดลอกข้อมูลเดิมมาใส่ tempSelection (Deep Copy)
          const existingItem = cart.find((i) => i.itemId === existingItemId);
          tempSelection = JSON.parse(JSON.stringify(existingItem));
          document.getElementById("btnAddToBasket").innerText =
            "บันทึกการแก้ไข";
        } else {
          // โหมดเพิ่มใหม่
          tempSelection = {
            itemId: Date.now(),
            catId: catId,
            name: cat.name,
            basePrice: cat.price,
            maxScoops: cat.max_scoops,
            selectedFlavors: [],
            selectedToppings: [],
            note: "",
          };
          document.getElementById("btnAddToBasket").innerText = "เพิ่มลงตะกร้า";
        }

        // แสดงผลใน Modal
        document.getElementById("modalTitle").innerText = tempSelection.name;
        document.getElementById("maxScoops").innerText =
          tempSelection.maxScoops;
        document.getElementById("itemNote").value = tempSelection.note || "";

        renderFlavorButtons();
        renderToppingOptions();

        document.getElementById("selectionModal").classList.add("active");
      }

      function closeSelectionModal() {
        document.getElementById("selectionModal").classList.remove("active");
      }

      function renderFlavorButtons() {
        const c = document.getElementById("flavorList");
        c.innerHTML = "";
        flavorsData.forEach((f) => {
          const avail = currentStock[`f-${f.id}`] !== false;
          // เช็คว่ารสนี้ถูกเลือกไว้หรือยัง (รองรับทั้งตอนเลือกใหม่ และตอนแก้ไข)
          const isSelected = tempSelection.selectedFlavors.includes(f.id);

          const div = document.createElement("div");
          div.className = `flavor-btn ${isSelected ? "selected" : ""} ${
            !avail ? "disabled" : ""
          }`;
          div.innerHTML = `<span class="flavor-color" style="background:${
            f.color
          }"></span>${f.name}${!avail ? " (หมด)" : ""}`;
          div.onclick = () => {
            if (avail) toggleFlavor(f.id);
          };
          c.appendChild(div);
        });
      }

      function toggleFlavor(id) {
        const idx = tempSelection.selectedFlavors.indexOf(id);
        if (idx > -1) {
          // ถ้ามีอยู่แล้ว ให้เอาออก
          tempSelection.selectedFlavors.splice(idx, 1);
        } else {
          // ถ้ายังไม่มี เช็คโควต้าก่อนเพิ่ม
          if (tempSelection.selectedFlavors.length < tempSelection.maxScoops) {
            tempSelection.selectedFlavors.push(id);
          } else {
            alert(`เลือกได้สูงสุด ${tempSelection.maxScoops} รสชาติครับ`);
            return;
          }
        }
        renderFlavorButtons(); // รีเฟรชปุ่ม
      }

      function renderToppingOptions() {
        const c = document.getElementById("toppingList");
        c.innerHTML = "";
        toppingsData.forEach((t) => {
          const avail = currentStock[`t-${t.id}`] !== false;
          const isChecked = tempSelection.selectedToppings.includes(t.id);

          // 🔥 แก้ไขการแสดงผลท็อปปิ้งให้มีรูปภาพ
          const imgHtml = t.img_url ? `<img src="${t.img_url}">` : "";
          const div = document.createElement("div");
          div.className = `topping-option ${!avail ? "disabled" : ""}`;
          div.innerHTML = `
                    <input type="checkbox" value="${t.id}" ${
            isChecked ? "checked" : ""
          } ${!avail ? "disabled" : ""} onchange="toggleTopping(this, ${t.id})">
                    ${imgHtml}
                    <span>${t.name} (+${t.price})</span>
                `;

          if (!avail) div.style.opacity = "0.5";
          c.appendChild(div);
        });
      }

      function toggleTopping(checkbox, id) {
        if (checkbox.checked) {
          tempSelection.selectedToppings.push(id);
        } else {
          const idx = tempSelection.selectedToppings.indexOf(id);
          if (idx > -1) tempSelection.selectedToppings.splice(idx, 1);
        }
      }

      function saveToCart() {
        if (tempSelection.selectedFlavors.length === 0)
          return alert("กรุณาเลือกรสชาติก่อนครับ");

        // คำนวณราคาใหม่ (Base + Toppings)
        const topPrice = tempSelection.selectedToppings.reduce((sum, tid) => {
          const t = toppingsData.find((x) => x.id === tid);
          return sum + (t ? t.price : 0);
        }, 0);
        tempSelection.totalPrice = tempSelection.basePrice + topPrice;
        tempSelection.note = document.getElementById("itemNote").value;

        // เช็คว่าเป็นการแก้ไข (มี itemId ซ้ำในตะกร้า) หรือเพิ่มใหม่
        const existingIndex = cart.findIndex(
          (i) => i.itemId === tempSelection.itemId
        );
        if (existingIndex > -1) {
          cart[existingIndex] = tempSelection; // ทับของเดิม
        } else {
          cart.push(tempSelection); // เพิ่มใหม่
        }

        closeSelectionModal();
        updateCartUI();

        // ถ้าเป็นการแก้ไข ให้เปิดหน้าตะกร้ากลับมาด้วย
        if (existingIndex > -1) openCartModal();
      }

      // --- Cart Logic ---
      function updateCartUI() {
        const t = cart.reduce((s, i) => s + i.totalPrice, 0);
        document.getElementById("cartCount").innerText = cart.length;
        document.getElementById("cartTotal").innerText = t + ".-";
        document.getElementById("cartModalTotal").innerText = t + ".-";
        document.getElementById("cartBar").style.display = cart.length
          ? "flex"
          : "none";
      }

      function openCartModal() {
        renderCartItems();
        document.getElementById("cartModal").classList.add("active");
      }
      function closeCartModal() {
        document.getElementById("cartModal").classList.remove("active");
      }

      function renderCartItems() {
        const c = document.getElementById("cartItemsList");
        c.innerHTML = "";
        if (!cart.length)
          return (c.innerHTML =
            '<p style="text-align:center; color:#999;">ตะกร้าว่างเปล่า</p>');

        cart.forEach((i) => {
          const fn = i.selectedFlavors
            .map((id) => flavorsData.find((f) => f.id === id)?.name)
            .join(", ");
          const tn = i.selectedToppings
            .map((id) => toppingsData.find((t) => t.id === id)?.name)
            .join(", ");

          c.innerHTML += `
                <div style="border-bottom:1px solid #eee; padding:10px; display:flex; justify-content:space-between; align-items:center;">
                    <div style="flex-grow:1;">
                        <strong>${i.name}</strong><br>
                        <small style="color:#666;">รส: ${fn}</small><br>
                        ${
                          tn
                            ? `<small style="color:#666;">ท็อปปิ้ง: ${tn}</small><br>`
                            : ""
                        }
                        ${
                          i.note
                            ? `<small style="color:blue;">📝 ${i.note}</small>`
                            : ""
                        }
                    </div>
                    <div style="text-align:right;">
                        <div style="font-weight:bold; margin-bottom:5px;">${
                          i.totalPrice
                        }.-</div>
                        <div>
                            <button onclick="closeCartModal(); openSelection(${
                              i.catId
                            }, ${
            i.itemId
          })" style="background:#ffdd59; border:none; border-radius:4px; cursor:pointer; padding:4px 8px; margin-right:5px;">✏️</button>
                            <button onclick="deleteItem(${
                              i.itemId
                            })" style="background:#ff7675; border:none; border-radius:4px; cursor:pointer; padding:4px 8px; color:white;">🗑️</button>
                        </div>
                    </div>
                </div>`;
        });
      }

      function deleteItem(id) {
        if (confirm("ลบรายการนี้?")) {
          cart = cart.filter((i) => i.itemId !== id);
          updateCartUI();
          renderCartItems();
          if (!cart.length) closeCartModal();
        }
      }

      // --- Submit & Tracking Logic ---
      function submitOrderToKitchen() {
        if (!cart.length) return;
        const t = cart.reduce((s, i) => s + i.totalPrice, 0);

        socket.emit(
          "place_order",
          { table: "Mobile", items: cart, totalPrice: t, note: "-" },
          (res) => {
            if (res.status === "success") {
              // สร้างออเดอร์ใหม่ พร้อมประทับเวลา (timestampRaw) เพื่อใช้คำนวณ 24 ชม.
              const newOrder = {
                id: res.orderId,
                items: cart.map((i) => i.name).join(", "),
                total: t,
                status: "pending",
                timestamp: new Date().toLocaleTimeString("th-TH"),
                timestampRaw: Date.now(), // เก็บเวลาแบบ Millisecond เพื่อคำนวณ
              };

              myOrders.unshift(newOrder);

              // บันทึกลง LocalStorage (ระบบจะ auto clean ตอนโหลดหน้าเว็บใหม่)
              localStorage.setItem(
                "myIceCreamOrders",
                JSON.stringify(myOrders)
              );

              cart = [];
              updateCartUI();
              closeCartModal();
              openTrackModal();
            }
          }
        );
      }

      function openTrackModal() {
        renderTrackList();
        document.getElementById("trackModal").classList.add("active");
      }
      function closeTrackModal() {
        document.getElementById("trackModal").classList.remove("active");
      }

      function renderTrackList() {
        const c = document.getElementById("trackList");
        c.innerHTML = "";
        // กรองและโหลดใหม่เผื่อมีอันไหนหมดอายุระหว่างใช้งาน
        myOrders = loadAndCleanOrders();

        if (!myOrders.length)
          return (c.innerHTML =
            '<p style="text-align:center; padding:20px;">ไม่มีประวัติการสั่งซื้อ (หรือหมดอายุแล้ว)</p>');

        myOrders.forEach((o) => {
          c.innerHTML += `
                <div style="background:white; padding:15px; margin-bottom:10px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.05);">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <span style="font-weight:bold;">Order #${o.id}</span>
                        <span style="color:#888; font-size:0.9rem;">${
                          o.timestamp
                        }</span>
                    </div>
                    <div style="color:#555; margin-bottom:10px;">${
                      o.items
                    }</div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:bold;">${o.total}.-</span>
                        <span style="padding:4px 10px; border-radius:20px; font-size:0.8rem; font-weight:bold; 
                            ${
                              o.status === "pending"
                                ? "background:#ffeaa7; color:#d63031;"
                                : "background:#55efc4; color:#00b894;"
                            }">
                            ${
                              o.status === "pending"
                                ? "⏳ กำลังทำ"
                                : "✅ เสร็จแล้ว"
                            }
                        </span>
                    </div>
                </div>`;
        });
      }

      function updateActiveOrderBadge() {
        // โหลดและคลีนก่อนนับ
        myOrders = loadAndCleanOrders();
        const count = myOrders.filter((o) => o.status === "pending").length;
        const b = document.getElementById("activeOrderCount");
        b.style.display = count ? "inline-block" : "none";
        b.innerText = count;
      }

      socket.on("order_status_changed", (data) => {
        const idx = myOrders.findIndex((o) => o.id === data.orderId);
        if (idx > -1) {
          myOrders[idx].status = data.status;
          localStorage.setItem("myIceCreamOrders", JSON.stringify(myOrders));
          updateActiveOrderBadge();
          if (
            document.getElementById("trackModal").classList.contains("active")
          )
            renderTrackList();
          // แจ้งเตือน (Optional)
          // alert(`Order #${data.orderId} status: ${data.status}`);
        }
      });

      socket.on("stock_update", (map) => {
        currentStock = map;
        if (
          document.getElementById("selectionModal").classList.contains("active")
        ) {
          renderFlavorButtons();
          renderToppingOptions();
        }
      });
    </script>
  </body>
</html>
