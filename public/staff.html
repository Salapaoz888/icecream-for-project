<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitchen Display</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script>
      if (!sessionStorage.getItem("userRole"))
        window.location.href = "login.html";
    </script>
  </head>
  <body class="staff-mode">
    <div class="header-bar">
      <div><h1>🧑‍🍳 Kitchen Monitor</h1></div>
      <div>
        <button class="btn-stock" onclick="openStockModal()">📦 ของหมด</button>
        <a
          href="login.html"
          onclick="sessionStorage.clear()"
          style="color: white; margin-left: 15px"
          >Logout</a
        >
      </div>
    </div>

    <div class="tabs">
      <button
        class="tab-btn active"
        onclick="switchTab('active')"
        id="tabActive"
      >
        ⏳ ออเดอร์เข้า
      </button>
      <button class="tab-btn" onclick="switchTab('history')" id="tabHistory">
        ✅ ทำเสร็จแล้ว
      </button>
    </div>

    <div class="order-container" id="orderList">Loading...</div>

    <div class="modal-overlay" id="stockModal">
      <div class="modal-content">
        <div style="display: flex; justify-content: space-between">
          <h2>📦 เช็คของหมด</h2>
          <button class="btn-close" onclick="closeStockModal()">&times;</button>
        </div>
        <h3>รสชาติ</h3>
        <div class="stock-grid" id="stockFlavorList"></div>
        <h3>ท็อปปิ้ง</h3>
        <div class="stock-grid" id="stockToppingList"></div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      let flavorsData = {},
        toppingsData = {},
        currentStock = {},
        currentTab = "active";

      window.onclick = function (event) {
        if (event.target.classList.contains("modal-overlay")) closeStockModal();
      };

      async function init() {
        const res = await fetch("/api/menu");
        const data = await res.json();
        flavorsData = {};
        toppingsData = {};
        data.flavors.forEach((f) => (flavorsData[f.id] = f));
        data.toppings.forEach((t) => (toppingsData[t.id] = t));
        renderStockItems(data.flavors, data.toppings);

        // โหลดข้อมูลครั้งแรก
        refreshData();
      }
      init();

      // 🔥 Realtime Update: เมื่อ Server บอกให้รีเฟรช ให้โหลดข้อมูลใหม่ตาม Tab ที่เปิดอยู่ทันที
      socket.on("force_refresh_staff", () => {
        refreshData();
      });

      socket.on("menu_updated", () => {
        init();
      });

      function switchTab(t) {
        currentTab = t;
        document.getElementById("tabActive").className =
          t === "active" ? "tab-btn active" : "tab-btn";
        document.getElementById("tabHistory").className =
          t === "history" ? "tab-btn active" : "tab-btn";
        refreshData();
      }

      function refreshData() {
        if (currentTab === "active") socket.emit("request_pending_orders");
        else socket.emit("request_admin_data");
      }

      socket.on("load_current_orders", (orders) => {
        if (currentTab === "active") renderOrders(orders, false);
      });
      socket.on("admin_data_response", (data) => {
        if (currentTab === "history") renderOrders(data.history, true);
      });

      function renderOrders(orders, isHistory) {
        const c = document.getElementById("orderList");
        c.innerHTML = "";

        if (!orders.length)
          return (c.innerHTML =
            '<div style="grid-column:1/-1;text-align:center; color:#888; margin-top:50px;">ไม่มีรายการ</div>');

        orders.forEach((o) => {
          // สร้างรายการสินค้า
          const items = o.items
            .map((i) => {
              const f = i.selectedFlavors
                .map((id) => flavorsData[id]?.name || id)
                .join(", ");
              const t = i.selectedToppings
                .map((id) => toppingsData[id]?.name || id)
                .join(", ");
              return `
                        <div class="order-item">
                            <span class="item-name">${i.name}</span>
                            <div style="font-size:0.9rem; color:#666;">รส: ${f}</div>
                            ${
                              t
                                ? `<div style="font-size:0.9rem; color:#666;">+ ${t}</div>`
                                : ""
                            }
                            ${
                              i.note
                                ? `<div class="item-note">${i.note}</div>`
                                : ""
                            }
                        </div>`;
            })
            .join("");

          // 🔥 ปุ่มจัดการ (Active vs History)
          let buttons = "";
          if (isHistory) {
            // Tab History: มีปุ่ม Undo
            buttons = `<button class="btn-undo" onclick="undoOrder(${o.id})">↩️ ดึงกลับ (Undo)</button>`;
          } else {
            // Tab Active: มีปุ่ม เสร็จแล้ว / แก้ไข / ลบ
            buttons = `
                        <div style="display:flex; gap:10px; margin-top:10px;">
                            <button class="btn-blue" onclick="editOrder(${o.id}, '${o.table_no}')" style="flex:1; padding:10px;">✏️ แก้ไข</button>
                            <button class="btn-red" onclick="deleteOrder(${o.id})" style="flex:1; padding:10px;">🗑️ ลบ</button>
                        </div>
                        <button class="btn-serve" onclick="completeOrder(${o.id})" style="margin-top:10px;">✅ เสร็จแล้ว</button>
                    `;
          }

          c.innerHTML += `
                    <div class="order-card" style="${
                      isHistory ? "border-left-color:gray; opacity:0.8;" : ""
                    }">
                        <div class="card-header">
                            <span class="table-num">${
                              o.table_no || o.table
                            }</span>
                            <span style="font-size:0.9rem;">${
                              o.timestamp || o.created_at
                            }</span>
                        </div>
                        <div class="card-body">${items}</div>
                        <div class="card-footer">${buttons}</div>
                    </div>`;
        });
      }

      // --- Actions ---
      function completeOrder(id) {
        socket.emit("complete_order", id);
      }
      function undoOrder(id) {
        socket.emit("undo_order", id);
      }

      function deleteOrder(id) {
        if (confirm("ยืนยันลบออเดอร์นี้? (กู้คืนไม่ได้)")) {
          socket.emit("delete_order", id);
        }
      }

      function editOrder(id, oldTable) {
        // ตัวอย่าง: แก้ไขเลขโต๊ะ (ถ้าจะแก้รายการอาหารต้องทำ UI ซับซ้อนกว่านี้)
        const newTable = prompt("แก้ไขเลขโต๊ะ:", oldTable);
        if (newTable && newTable !== oldTable) {
          socket.emit("edit_order_info", { id: id, table: newTable });
        }
      }

      // --- Stock Logic (เหมือนเดิม) ---
      socket.on("stock_update", (m) => {
        currentStock = m;
        updateStockUI();
      });
      function updateStockUI() {
        document.querySelectorAll(".stock-item").forEach((el) => {
          const avail = currentStock[el.dataset.id] !== false;
          el.className = `stock-item ${avail ? "active" : "inactive"}`;
        });
      }
      function renderStockItems(fList, tList) {
        const fc = document.getElementById("stockFlavorList");
        fc.innerHTML = "";
        fList.forEach((f) => {
          const id = `f-${f.id}`;
          const isAvailable = currentStock[id] !== false;
          const status = isAvailable ? "active" : "inactive";
          fc.innerHTML += `<div class="stock-item ${status}" data-id="${id}" onclick="toggleStock('${id}')">${f.name}</div>`;
        });
        const tc = document.getElementById("stockToppingList");
        tc.innerHTML = "";
        tList.forEach((t) => {
          const id = `t-${t.id}`;
          const isAvailable = currentStock[id] !== false;
          const status = isAvailable ? "active" : "inactive";
          tc.innerHTML += `<div class="stock-item ${status}" data-id="${id}" onclick="toggleStock('${id}')">${t.name}</div>`;
        });
      }
      function toggleStock(id) {
        socket.emit("toggle_stock", {
          itemId: id,
          available: currentStock[id] === false,
        });
      }
      function openStockModal() {
        document.getElementById("stockModal").style.display = "flex";
      }
      function closeStockModal() {
        document.getElementById("stockModal").style.display = "none";
      }
    </script>
  </body>
</html>
